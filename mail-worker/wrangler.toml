name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "ddc1f1ee-4ad2-4918-8804-948fdb48681f"

[[kv_namespaces]]
binding = "kv"
id = "05adbae2fcca485eab5799d1d791fa39"

#[[send_email]]
#name = "email"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"
analysis_cache = false
orm_log = false
domain = ["paopaofu.xyz"]
admin = "admin@paopaofu.xyz"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
